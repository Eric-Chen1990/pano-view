name: CI

on:
  pull_request:
    paths:
      - "packages/react/**"
      - "shared/**"
      - "apps/playground/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".changeset/config.json"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
  push:
    branches:
      - main
    paths:
      - "packages/react/**"
      - "shared/**"
      - "apps/playground/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".changeset/config.json"
      - ".github/workflows/ci.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @ericchen1990/pano-view typecheck && pnpm --filter @ericchen1990/pano-view-playground typecheck

      - name: Test viewer
        run: pnpm --filter @ericchen1990/pano-view test

      - name: Build
        run: pnpm --filter @ericchen1990/pano-view build && pnpm --filter @ericchen1990/pano-view-playground build

      - name: Pack check
        run: pnpm --filter @ericchen1990/pano-view pack:check

      - name: Check conflict markers and whitespace
        run: git diff --check
